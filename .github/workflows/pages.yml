# Publishes the browser version (web/ + the Python engine) to GitHub Pages.
name: Webseite

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "bildretter/engine.py"
      - "bildretter/jpegscan.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/py
          cp web/* _site/
          cp bildretter/__init__.py bildretter/engine.py bildretter/jpegscan.py _site/py/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
